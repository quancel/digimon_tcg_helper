name: Probe alysion.gg
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="digimon-alysion-helper (private deckbuilder)"
          curl -s -A "$UA" https://alysion.gg/card-tips.json -o tips.json; wc -c tips.json
          python3 -c "
          import json; d=json.load(open('tips.json')); print(type(d).__name__, len(d)); ks=list(d)
          print(ks[:5], ks[-5:])
          for k in ['BD1-002','BD2-005','BT1-010','ST25-02','BD01-02']:
            print(k, json.dumps(d.get(k), ensure_ascii=False))
          import collections; print(collections.Counter(k.split('-')[0] for k in ks))"
          curl -s -A "$UA" https://alysion.gg/cards/ -o list.html; wc -c list.html
          python3 -c "
          s=open('list.html',encoding='utf-8').read(); i=s.find('/cards/bd2-005/'); print(s[i-1500:i+700])"
