name: Probe alysion.gg
on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="digimon-alysion-helper (private deckbuilder)"
          curl -s -A "$UA" https://alysion.gg/_astro/CardTooltip.astro_astro_type_script_index_0_lang.C2QYX4x9.js -o t.js; wc -c t.js
          grep -o -E '"[^"]*\.json[^"]*"|fetch\([^)]{0,120}\)|/[a-z_/-]*tip[a-z_/-]*' t.js | sort -u | head -20
          head -c 1500 t.js; echo
          curl -s -A "$UA" https://alysion.gg/cards/bt1-010/agumon/ | python3 -c "
          import sys; s=sys.stdin.read(); i=s.find('detail-art'); print(s[i:i+2500])"
          curl -s -A "$UA" https://alysion.gg/cards/bd2-005/yukinamon/ | python3 -c "
          import sys; s=sys.stdin.read(); i=s.find('detail-art'); print(s[i:i+3000])"
