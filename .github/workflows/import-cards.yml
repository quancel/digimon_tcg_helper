name: Import card data

on:
  schedule:
    - cron: '0 4 * * 1' # every Monday 04:00 UTC
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/import-*.mjs', '.github/workflows/import-cards.yml']

permissions:
  contents: write

concurrency:
  group: import-cards
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/import-official.mjs
      - name: Commit updated card data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/cards.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Update card data from the official card list" && git push; fi
      - name: Import full Alysion pool into Supabase (private, not committed)
        run: node scripts/import-alysion.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
